modified: '2026-08-27'
# 2026-08-27: replaced the 2026-05-04 generated scaffold, which invented a Free / Pro / Enterprise
# ladder with fabricated request quotas and prices. Proactis publishes no pricing whatsoever.
tags:
  - Contract Management
  - Procurement
  - Purchase-To-Pay
  - Spend Management
description: >-
  Proactis publishes no plans, no price list and no self-service tier for its platform or its
  APIs. It is an enterprise source-to-pay suite sold through a sales motion: every commercial
  call to action on proactis.com is "Speak to an expert", and API credentials are issued only
  by contacting Proactis support. There is no signup, no trial and no published rate card.
plan_count: 0
plans: []
pricing_model: enterprise-contact-only
self_service: false
free_tier: false
trial: false
api_access:
  gated: true
  note: >-
    API access is not a purchasable product line. Obtaining OAuth 2.0 credentials and an API key
    requires an existing customer relationship — "For initial registration and to obtain OAuth 2.0
    credentials, please contact Proactis support."
  docs: https://docs.proactis.com/using-the-api/authentication
evidence:
  - url: https://www.proactis.com/
    finding: >-
      No Pricing entry in the primary navigation or the site footer; the site's conversion path is
      /speak-to-an-expert/. The published sitemap contains no pricing page.
  - url: https://www.proactis.com/us/policies/
    finding: >-
      Policy hub lists contractual terms and conditions but no price list or plan schedule.
  - url: https://docs.proactis.com/using-the-api/troubleshooting/rate-limits
    finding: >-
      Rate limits are stated per ENVIRONMENT (UAT vs production), not per plan — corroborating that
      there is no tiered commercial packaging of the API.
notes:
  - >-
    The absence is a real, scoreable fact about this provider, not a gap in this profile: a buyer
    cannot determine the cost of a Proactis integration without entering a sales conversation.
  - >-
    Because limits are uniform across customers rather than tiered, the rate-limit artifact carries
    no per-plan structure either.
