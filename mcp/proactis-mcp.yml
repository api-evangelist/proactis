description: >-
  Proactis ships no MCP server. No hosted endpoint, no stdio package, and no mention of MCP,
  agents or tool calling anywhere on proactis.com or docs.proactis.com. The tool list below is a
  DERIVED CANDIDATE — what an MCP server over the documented Proactis API surface would plausibly
  expose — recorded so the gap is legible. It is not a product, and none of these tools exist.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
search_performed:
  - target: docs.proactis.com
    query: MCP / Model Context Protocol / agent / tool
    result: no mention
  - target: registry.npmjs.org
    query: proactis
    result: no package
  - target: github.com/proactis-documentation
