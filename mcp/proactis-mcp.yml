blockers:
  - >-
    An MCP server over this API could not be built responsibly today without first solving three
    things Proactis does not currently provide: no fetchable OpenAPI to generate tool schemas from,
    no idempotency mechanism to make a retried write safe, and no reversal path for imported
    transactional documents.
  - >-
    The 8,000 requests/day organization-wide ceiling with no bulk operations and no rate-limit
    response headers means an agent would have no runtime signal for how much budget it has left.
