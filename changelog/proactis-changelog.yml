    changes:
      - api: Invoice API
        type: addition
        breaking: false
        title: Improved ISO 8601 date and time support on the payment endpoint
        summary: >-
          The payment endpoint now accepts additional ISO 8601 formats including time-zone
          offsets — yyyy-MM-dd'T'HH:mm:ssZ and yyyy-MM-dd'T'HH:mm:ssXXX are new in this
          release, alongside the previously supported yyyy-MM-dd'T'HH:mm and
          yyyy-MM-dd'T'HH:mm:ss. No action required for integrations already sending a
          supported format.
      - api: Receipt API
        type: addition
        breaking: false
        title: Receipt comments supported in REST API import and export
        summary: >-
          A single header comment can now be supplied on receipt import and existing comments
          are returned on export, multiple comments separated by line breaks. Stated as
          restoring parity with existing BizTalk-based integrations.
