    changes:
      - api: User API (SCIM)
        type: behaviour-change
        breaking: false
        title: Buyer privilege now inherited automatically on SCIM department master role import
        summary: >-
          Where a department master role carries the Buyer access privilege, importing that
          master role via SCIM now also adds the Buyer role to the user on that department.
          Previously the user received the master role but could not create requisitions on the
          department until Buyer was added separately. Follows on from the 9.6.2 SCIM default
          department master role extension.
