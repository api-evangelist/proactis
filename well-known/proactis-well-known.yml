notes:
  - >-
    The OAuth discovery gap is the substantive one. Proactis runs a real OAuth 2.0 authorization
    server on Amazon Cognito, and Cognito publishes an OpenID configuration document by default at
    its own issuer URL — but the Proactis-branded API hosts expose no discovery document, and the
    Cognito user-pool id is only recoverable by decoding the example JWT in the docs. A client has
    no supported way to discover the token endpoint programmatically.
  - >-
    /llms.txt returns a genuine 404 on the documentation host. Given how much of the Proactis
    developer surface is prose that reads well and how little of it is machine-readable, an
    llms.txt would be an unusually high-value, low-cost addition for this provider.
