apis:
  - aid: proactis:proactis-accounting
    name: Proactis Accounting API
    description: >-
      Configure the accounting structures that spend is coded against — departments, cost centers,
      cost accounts and cost dimensions, plus department addresses. Master data, so records are
      created with POST, updated with PUT and removed with DELETE, one object per request.
    humanURL: https://docs.proactis.com/apis/accounting-api/overview
    baseURL: https://apiuk.proactiscloud.com/accounting/v1
    tags:
      - Accounting
      - Master Data
      - Procurement
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/accounting-api/overview
      - type: APIReference
        url: https://docs.proactis.com/accounting-api
      - type: Examples
        url: https://docs.proactis.com/apis/accounting-api/sample-messages
  - aid: proactis:proactis-contract
    name: Proactis Contract API
    description: >-
      Create contracts in Proactis from an external system. The narrowest of the ten services —
      creation is the only capability the public documentation describes.
    humanURL: https://docs.proactis.com/apis/contract-api/overview
    baseURL: https://apiuk.proactiscloud.com
    tags:
      - Contract Management
      - Procurement
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/contract-api/overview
      - type: APIReference
        url: https://docs.proactis.com/contract-api
      - type: Examples
        url: https://docs.proactis.com/apis/contract-api/sample-messages
  - aid: proactis:proactis-einvoice
    name: Proactis eInvoice API
    description: >-
      Import electronic invoices created in another application into Proactis as OASIS UBL 2.1
      documents. Each invoice requires at least one line item; the API answers with a UBL response
      and subsequent processing is reported through the eInvoicing widgets.
    humanURL: https://docs.proactis.com/apis/einvoice-api/overview
    baseURL: https://apiuk.proactiscloud.com/einvoicing
    tags:
      - eInvoicing
      - UBL
      - Accounts Payable
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/einvoice-api/overview
      - type: APIReference
        url: https://docs.proactis.com/einvoice-api
      - type: Examples
        url: https://docs.proactis.com/apis/einvoice-api/sample-messages
  - aid: proactis:proactis-invoice
    name: Proactis Invoice API
    description: >-
      Retrieve invoices from Proactis, receive them pushed to your own endpoint as they reach a
      configured status, and write back payment information. Entry number and payment date are the
      two fields updatable only through the API, and every change is retained in the invoice audit
      log. Invoices fetched with GET do not include attachments; pushed invoices carry them as a
      multipart request.
    humanURL: https://docs.proactis.com/apis/invoice-api/overview
    baseURL: https://apiuk.proactiscloud.com
    tags:
      - Invoicing
      - Accounts Payable
      - cXML
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/invoice-api/overview
      - type: APIReference
        url: https://docs.proactis.com/invoice-api
      - type: Examples
        url: https://docs.proactis.com/apis/invoice-api/sample-messages
      - type: Schema
        url: https://docs.proactis.com/apis/invoice-api/export-definition
  - aid: proactis:proactis-order
    name: Proactis Order API
    description: >-
      Create ERP orders in Proactis and retrieve them, or have them pushed outbound as cXML. The
      order service is the only one that supports multiple push endpoints and per-endpoint custom
      HTTP headers, and it publishes both an import and an export cXML definition.
    humanURL: https://docs.proactis.com/apis/order-api/overview
    baseURL: https://apiuk.proactiscloud.com
    tags:
      - Purchase Orders
      - Purchase-To-Pay
      - cXML
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/order-api/overview
      - type: APIReference
        url: https://docs.proactis.com/order-api
      - type: Examples
        url: https://docs.proactis.com/apis/order-api/sample-messages
      - type: Schema
        url: https://docs.proactis.com/apis/order-api/export-definition
  - aid: proactis:proactis-receipt
    name: Proactis Receipt API
    description: >-
      Import goods receipts against existing orders and retrieve them. Receipts are posted as cXML
      ReceiptRequest documents referencing an order and line number, and a validation-only endpoint
      lets a client check a payload before importing it. From release 9.6.8 receipt comments are
      carried on both import and export.
    humanURL: https://docs.proactis.com/apis/receipt-api/overview
    baseURL: https://apiuk.proactiscloud.com/receipts/v1
    tags:
      - Receiving
      - Purchase-To-Pay
      - cXML
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/receipt-api/overview
      - type: APIReference
        url: https://docs.proactis.com/receipt-api
      - type: Examples
        url: https://docs.proactis.com/apis/receipt-api/sample-messages
      - type: Schema
        url: https://docs.proactis.com/apis/receipt-api/export-definition
  - aid: proactis:proactis-requisition
    name: Proactis Requisition API
    description: >-
      Retrieve requisitions, receive them pushed outbound, and run budget checks. Both an import and
      an export cXML definition are published, and requisition communication settings control the
      single outbound endpoint.
    humanURL: https://docs.proactis.com/apis/requisition-api/overview
    baseURL: https://apiuk.proactiscloud.com/requisitions/v1
    tags:
      - Requisitions
      - Purchase-To-Pay
      - Budget
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/requisition-api/overview
      - type: APIReference
        url: https://docs.proactis.com/requisition-api
      - type: Examples
        url: https://docs.proactis.com/apis/requisition-api/sample-messages
      - type: Schema
        url: https://docs.proactis.com/apis/requisition-api/export-definition
  - aid: proactis:proactis-supplier
    name: Proactis Supplier API
    description: >-
      Create, modify, delete and retrieve suppliers. Retrieval is paged and filterable — online
      status, name prefix and last-modified date are all supported query parameters — while writes
      are posted as cXML, with create, update and delete intent carried in the
      OrganizationChangeMessage attribute rather than by HTTP verb.
    humanURL: https://docs.proactis.com/apis/supplier-api/overview
    baseURL: https://apiuk.proactiscloud.com/suppliers/v1
    tags:
      - Supplier Management
      - Master Data
      - cXML
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/supplier-api/overview
      - type: APIReference
        url: https://docs.proactis.com/supplier-api
      - type: Examples
        url: https://docs.proactis.com/apis/supplier-api/sample-messages
      - type: Schema
        url: https://docs.proactis.com/apis/supplier-api/export-definition
  - aid: proactis:proactis-timecard
    name: Proactis Timecard API
    description: >-
      Create and retrieve timecards, with a dedicated HR-XML validation endpoint and timecard import
      operations. Timecards are one of the five document types Proactis will push outbound to a
      configured customer endpoint.
    humanURL: https://docs.proactis.com/apis/timecard-api/overview
    baseURL: https://apiuk.proactiscloud.com/timecards/v1
    tags:
      - Timecards
      - Services Procurement
      - HR-XML
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/timecard-api/overview
      - type: APIReference
        url: https://docs.proactis.com/timecard-api
      - type: Examples
        url: https://docs.proactis.com/apis/timecard-api/sample-messages
  - aid: proactis:proactis-user
    name: Proactis User API (SCIM 2.0)
    description: >-
      Provision users and department master roles into Proactis using SCIM 2.0. Users support POST,
      GET with filtering and pagination, PATCH or PUT, and DELETE — deletion applying only to users
      who own no data. SCIM groups are mapped onto Proactis department master roles, and from
      release 9.6.4 a master role carrying the Buyer access privilege grants the user the Buyer role
      on that department automatically at import.
    humanURL: https://docs.proactis.com/apis/user-api/overview
    baseURL: https://apiuk.proactiscloud.com/scim/v1
    tags:
      - Identity
      - SCIM
      - User Provisioning
    properties:
      - type: Documentation
        url: https://docs.proactis.com/apis/user-api/overview
      - type: APIReference
        url: https://docs.proactis.com/user-api
      - type: Examples
        url: https://docs.proactis.com/apis/user-api/sample-messages
