aid: proactis
name: Proactis
description: >-
  Proactis is a source-to-pay software provider whose platform covers eSourcing, contract
  management, supplier management, purchase-to-pay, marketplace and accounts payable automation
  for mid-market and public-sector organisations. Its developer surface is a set of ten separate
  REST APIs — accounting, contract, eInvoice, invoice, order, receipt, requisition, supplier,
  timecard and user — documented at docs.proactis.com and deployed across four regional
  environments (EU, NL, UK and US), each with a paired UAT and production estate. The APIs are
  standards-based rather than proprietary: transactional documents move as cXML, electronic
  invoices as UBL 2.1, identity and department master roles as SCIM 2.0, and timecards as HR-XML,
  all behind OAuth 2.0 client-credentials tokens paired with a fixed API key. Proactis also pushes
  transactional documents outbound to customer-configured endpoints. Access is gated: credentials
  are issued only by Proactis support, and no machine-readable contract is published.
type: Index
