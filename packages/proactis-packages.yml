  assessment: >-
    The organisation is abandoned. All three repositories stopped receiving commits in 2017-2019,
    and the live documentation site at docs.proactis.com is not built from any of them. This is a
    stale pointer, not an active engineering presence.
findings:
  - >-
    No SDK in any language. For a provider whose transactional APIs require correctly-formed cXML
    1.2.x documents with mandatory-but-unused elements — the published receipt example annotates
    several fields as "Not used but mandatory by cXML" — the absence of even one reference client
    puts the entire serialisation burden on every integrator, repeatedly.
  - >-
    No CLI, no Postman collection, and no downloadable spec, so there is nothing a developer can
    import to get a first call working.
  - >-
    Because no package exists, there is no release-recency signal to read here; the abandonment
    evidence for this provider comes from the GitHub organisation instead.
